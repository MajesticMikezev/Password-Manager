services:

  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: password-manager-backend

    ports:
    - "8000:8000"

    restart: unless-stopped

  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: password-manager-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped